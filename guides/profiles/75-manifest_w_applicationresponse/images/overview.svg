<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="778" height="358" fill="white" stroke="#333333" stroke-width="1.5"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <path d="M10,36 L10,10 L226,10 L240,24 L240,36 Z" fill="#F5F5F5" stroke="#333333" stroke-width="1.2"/>
  <text x="20" y="27" font-size="13" font-weight="bold" fill="#333333">Business Process Overview</text>
<circle cx="90" cy="180" r="22" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
<text x="90" y="218" font-size="12" fill="#333333" text-anchor="middle">Start</text>

  <rect x="190.0" y="145.0" width="220" height="70" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="300" y="175.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Send Manifest and wait</text>
<text x="300" y="192.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">for Application Response</text>

<polygon points="540,152 568,180 540,208 512,180" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="540" y="224" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">Manifest</text>
<text x="540" y="238" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">accepted?</text>
<circle cx="710" cy="180" r="22" fill="#F8CECC" stroke="#B85450" stroke-width="3"/>
<text x="710" y="218" font-size="12" fill="#333333" text-anchor="middle">End</text>

  <rect x="190.0" y="270.0" width="220" height="60" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="300" y="295.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Correct and resend</text>
<text x="300" y="312.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Manifest</text>

<path d="M112,180 L190,180" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M410,180 L512,180" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M568,180 L688,180" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="628" y="172" font-size="12" fill="#333333" text-anchor="middle">Yes</text>
<path d="M540,208 L540,300 L410,300" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="558" y="250" font-size="12" fill="#333333" text-anchor="middle">No</text>
<path d="M300,270 L300,215" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
