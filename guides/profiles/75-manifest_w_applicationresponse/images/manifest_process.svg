<text x="850" y="212.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Response</text>

<polygon points="1110,172 1138,200 1110,228 1082,200" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="1110" y="244" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">Manifest</text>
<text x="1110" y="258" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">accepted?</text>
