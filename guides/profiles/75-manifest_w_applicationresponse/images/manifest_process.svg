  <rect x="40" y="60" width="1220" height="280" fill="none" stroke="#666666" stroke-width="1.3"/>
  <line x1="66" y1="60" x2="66" y2="340" stroke="#666666" stroke-width="1.3"/>
  <text x="53.0" y="200.0" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle"
