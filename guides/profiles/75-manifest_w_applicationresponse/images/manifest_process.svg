<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 660" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="1298" height="658" fill="white" stroke="#333333" stroke-width="1.5"/>

  <defs>
