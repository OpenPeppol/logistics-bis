<circle cx="280" cy="500" r="18" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
<rect x="269.65" y="492.8" width="20.7" height="14.4" fill="#F8CECC" stroke="#B85450" stroke-width="1.3"/>
<path d="M269.65,492.8 L280,502.16 L290.34999999999997,492.8" fill="none" stroke="#B85450" stroke-width="1.3"/>

  <rect x="360.0" y="465.0" width="220" height="70" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="470" y="495.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Receive and check</text>
<text x="470" y="512.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Manifest</text>


  <rect x="730.0" y="465.0" width="240" height="70" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="850" y="495.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Prepare and send</text>
<text x="850" y="512.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Application Response</text>

<circle cx="1080" cy="500" r="20" fill="#F8CECC" stroke="#B85450" stroke-width="3"/>
<path d="M298,500 L360,500" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M580,500 L730,500" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M970,500 L1060,500" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="280" cy="235" r="4" fill="white" stroke="#333333" stroke-width="1.3"/>
<path d="M280,236 L280,482" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
<text x="330" y="360" font-size="12" fill="#333333" text-anchor="middle">Manifest</text>
<circle cx="850" cy="465" r="4" fill="white" stroke="#333333" stroke-width="1.3"/>
<path d="M850,464 L850,236" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
<text x="970" y="360" font-size="12" fill="#333333" text-anchor="middle">Application Response</text>
