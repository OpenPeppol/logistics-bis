<path d="M130,200 L180,200" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M380,200 L740,200" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M960,200 L1082,200" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1138,200 L1210,200" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1175" y="190" font-size="12" fill="#333333" text-anchor="middle">Yes</text>
<path d="M1110,172 L1110,90 L280,90 L280,165" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
