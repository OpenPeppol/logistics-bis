  <rect x="40" y="340" width="1220" height="280" fill="none" stroke="#666666" stroke-width="1.3"/>
  <line x1="66" y1="340" x2="66" y2="620" stroke="#666666" stroke-width="1.3"/>
  <text x="53.0" y="480.0" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle"
        transform="rotate(-90 53.0 480.0)">Receiving Party (e.g. Authority)</text>
<circle cx="110" cy="200" r="20" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>

  <rect x="180.0" y="165.0" width="200" height="70" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="280" y="195.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Prepare and send</text>
<text x="280" y="212.8" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">Manifest</text>


  <rect x="740.0" y="165.0" width="220" height="70" rx="8" ry="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
